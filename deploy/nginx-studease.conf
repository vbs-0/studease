# StudEase: static frontend plus a reverse proxy to the API on 127.0.0.1:8100.
# Certbot adds the TLS server block and the http -> https redirect (see docs/deploy.md).
server {
    listen 80;
    listen [::]:80;
    server_name studease.is-cool.dev;

    root /opt/studease/app/frontend/dist;
    index index.html;

    client_max_body_size 64k;                       # S-10: no request needs more
    server_tokens off;

    # S-16: security headers on every response
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # fingerprinted build assets never change under the same name
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # single-page app: unknown paths get index.html and the React router shows its own 404 page
    location / {
        try_files $uri /index.html;
    }

    # when the API is down, show a static page instead of nginx's default
    error_page 502 503 504 /50x.html;
    location = /50x.html { internal; }
}
