<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudEase · Tuition, scholarships and balance reconciliation</title>
    <meta name="description" content="StudEase bills tuition and fees, decides scholarship eligibility, allocates payments and reconciles every student balance against an append-only ledger. Synthetic data, fully auditable." />
    <meta name="theme-color" content="#f6f6f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="StudEase: tuition, scholarships and balance reconciliation" />
    <meta property="og:description" content="Fee billing, scholarship eligibility, payment allocation and a three-way balance check, on synthetic data." />
    <meta property="og:site_name" content="StudEase" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading StudEase"><p>StudEase</p><span class="bar"></span></div>
      <style>
        body { margin: 0; background: #f6f6f6; }
        .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font: 700 14px/1 system-ui, sans-serif; letter-spacing: .2em; color: #191919; }
        .boot .bar { width: 120px; height: 3px; background: rgba(25,25,25,.15); position: relative; overflow: hidden; }
        .boot .bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; background: #d63a12; animation: bootslide 1.1s ease-in-out infinite; }
        @keyframes bootslide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
        @media (prefers-color-scheme: dark) { body { background: #121212; } .boot { color: #f4f1e8; } }
        @media (prefers-reduced-motion: reduce) { .boot .bar::after { animation: none; } }
      </style>
      <noscript>StudEase needs JavaScript. The API is documented at /api/v1/docs.</noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
