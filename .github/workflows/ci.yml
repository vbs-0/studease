name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
# a newer push to the same branch cancels the run still in progress, so CI minutes go to the latest commit only
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: studease, POSTGRES_PASSWORD: studease, POSTGRES_DB: studease_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studease" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://studease:studease@127.0.0.1:5432/studease_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - name: Install
        run: cd backend && uv sync --frozen
      - name: Lint
        run: cd backend && uv run ruff check app tests
      - name: Test
        run: cd backend && uv run pytest -q
      - name: Generated docs are current
        run: cd backend && uv run python -m app.cli docs --check
      - name: Reproducible data
        run: cd backend && uv run python -m app.cli repro --scale starter
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci --no-audit --no-fund
      - run: cd frontend && npx tsc -b
      - run: cd frontend && npm test
      - run: cd frontend && npm run build
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: No private details in the public repository
        run: python scripts/scrub_check.py
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: cd mobile && flutter pub get
      - name: Static analysis (errors fail the build; style notes do not)
        run: cd mobile && flutter analyze --no-fatal-infos --no-fatal-warnings
