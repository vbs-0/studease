name: Release APK
# Pushing a tag such as v1.0.0 builds the Android app and publishes it as a GitHub release with the APK attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: cd mobile && flutter pub get
      - name: Build the APKs (debug-signed, fine for sideloading)
        run: |
          cd mobile
          flutter build apk --release
          flutter build apk --release --split-per-abi
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk ../out/StudEase.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../out/StudEase-arm64.apk
          sha256sum ../out/*.apk | tee ../out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: { name: studease-apk, path: out/* }
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: StudEase ${{ github.ref_name }} (Android)
          generate_release_notes: true
          body: |
            Android app for StudEase. Install `StudEase-arm64.apk` on any recent phone (smaller), or `StudEase.apk` for every CPU type.
            Allow "install unknown apps" for your browser or file manager, open the file, then sign in with a demo account or create a learner account.
            The app talks to https://studease.is-cool.dev. Checksums are in `SHA256SUMS.txt`.
          files: |
            out/StudEase.apk
            out/StudEase-arm64.apk
            out/SHA256SUMS.txt
